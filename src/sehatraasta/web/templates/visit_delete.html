{% extends 'base.html' %}{% block content %}
<p><strong><bdi dir="auto">{{ patient.name }}</bdi></strong> · <bdi dir="auto">{{ bundle.source_facility }}</bdi> · {{ bundle.creation_time.strftime('%Y-%m-%d %H:%M') }}</p>
<p>{{ t('visit.remove_help') }}</p>
{% if error %}<p role="alert" class="error-summary">{{ t(error) }}</p>{% endif %}
<form method="post" class="entry-form"><input type="hidden" name="csrf" value="{{ form_token() }}"><input type="hidden" name="lang" value="{{ lang }}"><input type="hidden" name="revision" value="{{ patient._storage_revision }}">
<label><input type="checkbox" name="confirm" value="yes" required>{{ t('visit.remove_confirm') }}</label><div class="form-actions"><button>{{ t('visit.remove') }}</button><a href="{{ url_for('pages.bundle', bundle_id=bundle.ID, lang=lang) }}">{{ t('action.cancel') }}</a></div></form>
{% endblock %}
